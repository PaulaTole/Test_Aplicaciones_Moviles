<ion-header>
  <ion-toolbar color="light">
    <div class="user-header">
      <img
        src="assets/icon/default user profile.png"
        alt="Usuario"
        class="user-icon"
      />

      <div class="user-info">
        <h2>{{ usuarios[0]?.nombre || 'Usuario' }}</h2>
        <p>{{ usuarios[0]?.correo }}</p>
      </div>
    </div>
  </ion-toolbar>

  <!-- Línea separadora -->
  <div class="separator"></div>
</ion-header>

<ion-content>

  <!-- Aquí vas a poner tu reproductor -->


  <div class="player-container">
    <h3>Reproductor</h3>
    <ion-list>
      <ion-item *ngFor="let item of playlist; let i = index">
        <ion-label>{{ item.name }}</ion-label>
        <ion-button (click)="play(i)">
          <ion-icon [icon]="playIcon"></ion-icon>
        </ion-button>

      <ion-button (click)="pause()">
          <ion-icon [icon]="pauseIcon"></ion-icon>
          Pause
      </ion-button>

      </ion-item>
    </ion-list>
  </div>

</ion-content>
