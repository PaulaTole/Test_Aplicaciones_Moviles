<ion-header>
  <ion-toolbar>
    <ion-title>Reproductor de Audio</ion-title>

    <ion-buttons slot="end">
      <ion-button fill="clear" id="profileButton" (click)="toggleProfileMenu($event)">
        <ion-avatar style="width:36px; height:36px;">
          <img [src]="profileImg || 'assets/default-avatar.png'" alt="Perfil" />
        </ion-avatar>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-popover [isOpen]="menuOpen" [event]="popoverEvent" (ionPopoverDidDismiss)="closeMenu()" class="my-popover">
  <ion-content class="popover-content">
    <ion-list lines="none">
      <ion-item button (click)="onMiPerfil()">
        <ion-icon name="person-circle-outline" slot="start"></ion-icon>
        <ion-label>Mi perfil</ion-label>
      </ion-item>

      <ion-item button (click)="onListas()">
        <ion-icon name="library-outline" slot="start"></ion-icon>
        <ion-label>Listas de reproducción</ion-label>
      </ion-item>

      <ion-item button (click)="onLogout()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <ion-label>Cerrar sesión</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-popover>

<ion-content class="audio-player-content" id="main-content">
  <div class="player-wrapper">
    <div class="cover-container">
      <img src="assets/audio/cover.jpg" alt="Portada" class="cover-image" />
    </div>

    <div class="controls-container">
      <div class="controls-row">
        <ion-button expand="block" (click)="playAudio()">▶ Reproducir</ion-button>
        <ion-button expand="block" (click)="pauseAudio()">⏸ Pausar</ion-button>
      </div>

      <div class="progress-container">
        <ion-range
          min="0"
          [max]="duration"
          [value]="currentTime"
          (ionChange)="seekAudio($event)"
          color="primary">
        </ion-range>

        <div class="time-labels">
          <span>{{ formatTime(currentTime) }}</span>
          <span>{{ formatTime(duration) }}</span>
        </div>
      </div>
    </div>
  </div>
</ion-content>
