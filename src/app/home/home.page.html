  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Menú</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-item routerLink="/home">
          <ion-icon name="home-outline" slot="start"></ion-icon>
          <ion-label>Inicio</ion-label>
        </ion-item>
        <ion-item routerLink="/perfil">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>Perfil</ion-label>
        </ion-item>
        <ion-item routerLink="/configuracion">
          <ion-icon name="settings-outline" slot="start"></ion-icon>
          <ion-label>Configuración</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col *ngFor="let user of users$ | async" size="12" size-md="4" size-lg="3">
        <ion-card>
          <ion-item>
            <ion-avatar slot="start">
              <img [src]="user.picture.medium" alt="Avatar">
            </ion-avatar>
            <ion-label>
              <h2>{{ user.name?.first }} {{ user.name?.last }}</h2>
            </ion-label>
          </ion-item>

          <ion-card-content>
            Bacon ipsum dolor amet salami prosciutto ham hock, strip steak buffalo ribeye pork chop.
            Beef ribs tenderloin tail shoulder brisket rump hamburger. Pork belly kevin shoulder prosciutto.
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
