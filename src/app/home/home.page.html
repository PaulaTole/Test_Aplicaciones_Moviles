<ion-header>
  <ion-toolbar color="light">
    <ion-header>
      <ion-toolbar color="light"> <ion-buttons slot="start">
          <ion-menu-button auto-hide="false"></ion-menu-button>
        </ion-buttons>
        <ion-title>Inicio</ion-title> </ion-toolbar>
    </ion-header>

    <div class="user-header" style="display:flex; align-items:center; gap:12px;">
      <img src="assets/icon/default_user_profile.png" class="user-icon" style="width:40px;height:40px;border-radius:50%;"/>
      <div class="user-info">
        <h3 style="margin:0;">{{ usuarios[0]?.nombre || 'Usuario' }}</h3>
        <p style="margin:0;font-size:12px;color:gray;">{{ usuarios[0]?.correo || '' }}</p>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <h2 style="padding:16px 16px 0 16px;">Reproductor</h2>

  <ion-list>
    <ion-item *ngFor="let track of tracks; let i = index">
      <ion-thumbnail slot="start">
        <ion-button fill="clear" (click)="irANowPlaying()" class="music-launcher">
          <img src="assets/icon/music_icon.png" class="mini-music-icon" style="width:40px;height:40px;">
        </ion-button>
      </ion-thumbnail>

      <ion-label>
        <h3>{{ track.name }}</h3>
      </ion-label>

      <ion-button *ngIf="currentIndex !== i || !isPlaying" (click)="playTrack(i)">
        ▶️
      </ion-button>

      <ion-button *ngIf="currentIndex === i && isPlaying" color="danger" (click)="pauseTrack()">⏸️</ion-button>
    </ion-item>

    <ion-item *ngIf="currentTrack">
      <ion-range [min]="0" [max]="duration" [value]="progress" (ionChange)="seekTrack($event)"></ion-range>
    </ion-item>
  </ion-list>
</ion-content>
