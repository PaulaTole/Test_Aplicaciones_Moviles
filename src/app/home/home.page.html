<ion-header>
  <ion-toolbar>
    <ion-title>
      Reproductor de Audio
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="audio-player-content" id="main-content">
  <div class="player-wrapper">
    <div class="cover-container">
      <img src="assets/audio/cover.jpg" alt="Portada" class="cover-image" />
    </div>

    <div class="controls-container">
      <div class="controls-row">
        <ion-button expand="block" (click)="playAudio()">▶ Reproducir</ion-button>
        <ion-button expand="block" (click)="pauseAudio()">⏸ Pausar</ion-button>
      </div>

      <div class="progress-container">
        <ion-range
          min="0"
          [max]="duration"
          [value]="currentTime"
          (ionChange)="seekAudio($event)"
          color="primary">
        </ion-range>

        <div class="time-labels">
          <span>{{ formatTime(currentTime) }}</span>
          <span>{{ formatTime(duration) }}</span>
        </div>
      </div>
    </div>
  </div>
</ion-content>
