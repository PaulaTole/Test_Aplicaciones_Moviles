<ion-header class="ion-no-border">
  <ion-toolbar color="light">
    
    <ion-buttons slot="start">
      <ion-menu-button auto-hide="false"></ion-menu-button>
    </ion-buttons>

    <ion-title>Perfil</ion-title>

    <ion-buttons slot="end" class="ion-padding-end">
      <div class="user-header" style="display:flex; align-items:center; gap:8px;">
        <div class="user-info" style="text-align: right;">
          <h3 style="margin:0; font-size: 14px;">{{ usuario.nombre || 'Usuario' }}</h3>
          <p style="margin:0; font-size:10px; color:gray;">{{ usuario.correo || '' }}</p>
        </div>
        <img [src]="currentImage" 
             class="user-icon" 
             style="width:35px; height:35px; border-radius:50%; object-fit: cover; border: 1px solid #ccc;"/>
      </div>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content>
  
  <div style="display: flex; flex-direction: column; align-items: center; padding-top: 20px;">
    <ion-avatar style="width: 120px; height: 120px; border: 3px solid var(--ion-color-primary);">
      <img [src]="currentImage" alt="Foto de perfil" style="object-fit: cover;" />
    </ion-avatar>
    
    <ion-button fill="clear" (click)="takePicture()">
      <ion-icon slot="start" name="camera"></ion-icon>
      Cambiar Foto
    </ion-button>
  </div>
  <ion-list style="padding:16px;">
    <ion-item>
      <ion-label position="stacked">Nombre</ion-label>
      <ion-input [(ngModel)]="usuario.nombre"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Correo</ion-label>
      <ion-input [(ngModel)]="usuario.correo" type="email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Contraseña</ion-label>
      <ion-input [(ngModel)]="usuario.contrasenna" type="password"> 
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>
    </ion-item>

    <div style="padding:16px;">
      <ion-button expand="block" (click)="guardar()">Guardar Cambios</ion-button>
    </div>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="primary">
      <ion-icon name="grid"></ion-icon>
    </ion-fab-button>
    
    <ion-fab-list side="top">
      <ion-fab-button (click)="logout()" color="danger"><ion-icon name="log-out"></ion-icon></ion-fab-button>
      
      <ion-fab-button routerLink="/main/perfil" routerDirection="root" color="secondary">
        <ion-icon name="person"></ion-icon>
      </ion-fab-button>
      
      <ion-fab-button routerLink="/main/now-playing" routerDirection="root" color="tertiary">
        <ion-icon name="musical-notes"></ion-icon>
      </ion-fab-button>
      
      <ion-fab-button routerLink="/main/home" routerDirection="root" color="light">
        <ion-icon name="home"></ion-icon>
      </ion-fab-button>
    </ion-fab-list>
  </ion-fab>
</ion-content>
