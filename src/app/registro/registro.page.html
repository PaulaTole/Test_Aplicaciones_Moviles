<ion-content>
  <form (submit)="registrar($event)">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input
        #nombreInput
        type="text"
        [(ngModel)]="nombre"
        name="nombre"
        required
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Correo</ion-label>
      <ion-input
        #emailInput
        type="email"
        [(ngModel)]="correo"
        name="correo"
        required
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input
        #contrasennaInput
        type="password"
        [(ngModel)]="contrasenna"
        name="contrasenna"
        required
      ></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" color="primary">
      Registrarse
    </ion-button>
  </form>

  <ion-button
    expand="block"
    color="medium"
    (click)="irALogin()"
    style="margin-top: 1rem"
  >
    Volver al Login
  </ion-button>
</ion-content>
