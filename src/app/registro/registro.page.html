<form (submit)="registrar($event)">
  <ion-item>
    <ion-label position="floating">Nombre</ion-label>
    <ion-input
      #nombreInput
      type="text"
      [(ngModel)]="nombre"
      name="nombre"
      required>
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Correo</ion-label>
    <ion-input
      #emailInput
      type="email"
      [(ngModel)]="correo"
      name="correo"
      required>
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Contraseña</ion-label>
    <ion-input
      #contrasennaInput
      type="password"
      [(ngModel)]="contrasenna"
      name="contrasenna"
      required>
    </ion-input>
  </ion-item>

  <ion-button expand="block" type="submit">
    Registrarse
  </ion-button>

  <ion-button expand="block" fill="clear" routerLink="/login">
  ¿Ya tienes una cuenta? Inicia sesión
  </ion-button>
</form>
