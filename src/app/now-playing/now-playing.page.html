<ion-header class="ion-no-border">
  <ion-toolbar color="light">
    
    <ion-buttons slot="start">
      <ion-menu-button auto-hide="false"></ion-menu-button>
    </ion-buttons>

    <ion-title>Reproductor</ion-title>

    <ion-buttons slot="end" class="ion-padding-end">
      <div class="user-header" style="display:flex; align-items:center; gap:8px;">
        <div class="user-info" style="text-align: right;">
          <h3 style="margin:0; font-size: 14px;">{{ usuarios[0]?.nombre || 'Usuario' }}</h3>
          <p style="margin:0; font-size:10px; color:gray;">{{ usuarios[0]?.correo || '' }}</p>
        </div>
        <img src="assets/icon/default_user_profile.png" 
             class="user-icon" 
             style="width:35px; height:35px; border-radius:50%; object-fit: cover; border: 1px solid #ccc;"/>
      </div>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-menu-button auto-hide="false"></ion-menu-button>
    </ion-buttons>

    <ion-title>Reproduciendo</ion-title>

    <ion-buttons slot="end" class="ion-padding-end">
      <div style="font-size: 12px; text-align: right;">
        <p style="margin:0; font-weight:bold;">{{ usuarios[0]?.nombre || 'Usuario' }}</p>
      </div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  
  <div class="player-container">
    
    <div class="cover-container">
      <img [src]="currentTrack?.cover || 'assets/icon/music_icon.png'" 
           class="cover-image"
           [class.spinning]="isPlaying">
    </div>

    <div class="track-info">
      <h2>{{ currentTrack?.name || 'Selecciona una canción' }}</h2>
      <p>Artistas Varios</p> </div>

    <div class="progress-section">
      <ion-range 
        [min]="0" 
        [max]="duration" 
        [value]="progress" 
        (ionChange)="onRangeChange($event)"
        color="primary">
        
        <ion-label slot="start" style="font-size: 12px;">{{ progress | number:'1.0-0' }}</ion-label>
        <ion-label slot="end" style="font-size: 12px;">{{ duration | number:'1.0-0' }}</ion-label>
      </ion-range>
    </div>

    <div class="controls-section">
      <ion-button fill="clear" size="large" (click)="prev()">
        ⏮️
      </ion-button>

      <ion-button *ngIf="!isPlaying" (click)="resumeTrack()" shape="round" color="primary" size="large">
        ▶️
      </ion-button>
      
      <ion-button *ngIf="isPlaying" (click)="pauseTrack()" shape="round" color="danger" size="large">
        ⏸️
      </ion-button>

      <ion-button fill="clear" size="large" (click)="next()">
        ⏭️
      </ion-button>
    </div>

  </div>


  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="primary">
      <ion-icon name="grid"></ion-icon>
    </ion-fab-button>
    
    <ion-fab-list side="top">
      <ion-fab-button (click)="logout()" color="danger"><ion-icon name="log-out"></ion-icon></ion-fab-button>
      <ion-fab-button routerLink="/main/perfil" color="secondary"><ion-icon name="person"></ion-icon></ion-fab-button>
      <ion-fab-button routerLink="/main/now-playing" color="tertiary"><ion-icon name="musical-notes"></ion-icon></ion-fab-button>
      <ion-fab-button routerLink="/main/home" color="light"><ion-icon name="home"></ion-icon></ion-fab-button>
    </ion-fab-list>
  </ion-fab>
</ion-content>
