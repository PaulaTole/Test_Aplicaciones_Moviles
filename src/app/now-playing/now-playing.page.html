<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>

    <div style="display:flex;align-items:center;gap:12px;">
      <img src="assets/icon/default_user_profile.png" style="width:36px;height:36px;border-radius:50%;">
      <div>
        <h3 style="margin:0">{{ usuarios[0]?.nombre || 'Usuario' }}</h3>
        <p style="margin:0;font-size:12px;color:gray;">{{ usuarios[0]?.correo || '' }}</p>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content id="now-playing-content">
  <h2 style="padding:16px 16px 0 16px;">Reproduciendo ahora</h2>

  <ion-card *ngIf="currentTrack">
    <ion-card-header>
      <ion-card-title>{{ currentTrack?.name }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item lines="none">
        <ion-range [min]="0" [max]="duration" [value]="progress" (ionChange)="onRangeChange($event)"></ion-range>
      </ion-item>

      <p>Tiempo: {{ progress | number:'1.0-0' }} / {{ duration | number:'1.0-0' }}</p>

      <div style="display:flex;gap:12px;justify-content:center;padding-top:8px;">
        <ion-button (click)="prev()">⏮️</ion-button>
        <ion-button *ngIf="!isPlaying" (click)="resumeTrack()">▶️</ion-button>
        <ion-button *ngIf="isPlaying" color="danger" (click)="pauseTrack()">⏸️</ion-button>
        <ion-button (click)="next()">⏭️</ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
