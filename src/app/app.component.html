<ion-app>
  <!-- MENÚ GLOBAL -->
  <ion-menu side="start" menuId="main-menu" contentId="main-content">
    <ion-header>
      <ion-toolbar color="light">
        <ion-title>Menú</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-item button routerLink="/home">🏠 Home</ion-item>
        <ion-item button routerLink="/perfil">👤 Editar Perfil</ion-item>
        <ion-item button routerLink="/login">🚪 Logout</ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- CONTENIDO PRINCIPAL (ion-menu apunta al router-outlet por id) -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
